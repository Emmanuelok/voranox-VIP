name: CI

on:
  push:
    branches:
      - main
      - master
      - "claude/**"
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Stable env so the build is deterministic. Real secrets are
      # not required for the build path; the production app reads them
      # from Vercel project env vars at runtime.
      NEXT_TELEMETRY_DISABLED: "1"
      PORTAL_SECRET: "ci-portal-secret-not-real"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
